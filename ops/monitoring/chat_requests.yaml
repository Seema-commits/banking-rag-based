description: Chat requests by outcome (answered, not_found, llm_auth_error, llm_rate_limited, error, ...)
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="thistlewood-assistant" AND jsonPayload.event="chat"'
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
  - key: outcome
    valueType: STRING
labelExtractors:
  outcome: EXTRACT(jsonPayload.outcome)
